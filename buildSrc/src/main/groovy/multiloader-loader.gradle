plugins {
    id 'multiloader-common'
    id 'me.modmuss50.mod-publish-plugin'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

publishMods {
    def changelogFile = rootProject.file("CHANGELOG.md")
    changelog = changelogFile.text

    type = STABLE
    version = "${project.version}"

    def loaderDisplayNames = [
            'fabric': 'Fabric',
            'neoforge': 'NeoForge',
            'forge': 'Forge'
    ]
    def loaderName = loaderDisplayNames.get(project.name, project.name.capitalize())
    displayName = "${mod_name} ${loaderName} v${project.version}"

    if (project.name == 'fabric') {
        modLoaders.addAll('fabric', 'quilt')
    } else if (project.name == 'neoforge') {
        modLoaders.add('neoforge')
    } else if (project.name == 'forge') {
        modLoaders.add('forge')
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = rootProject.properties['curseforge_id']

        if (project.name == 'fabric') {
            minecraftVersions.add("1.21.1")
        } else if (project.name in ['neoforge', 'forge']) {
            minecraftVersions.addAll(
                    "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5",
                    "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"
            )
        }
    }

    //modrinth {
    //    accessToken = providers.environmentVariable("MODRINTH_TOKEN")
    //    projectId = rootProject.properties['modrinth_id']
    //    if (project.name == 'fabric') {
    //        minecraftVersions.add("1.21.1")
    //    } else if (project.name in ['neoforge', 'forge']) {
    //        minecraftVersions.addAll(
    //            "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5",
    //            "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"
    //        )
    //    }
    //}

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = rootProject.properties['github_repo']
        commitish = providers.environmentVariable("GITHUB_SHA").orElse("")
        tagName = "v${project.version}"
    }
}